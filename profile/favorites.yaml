# Papers I liked. The "your favorites" score of a new paper is the weighted
# maximum cosine similarity between it and these.
#
# Same format as own_papers.yaml: a title, plus an `arxiv` id or `doi` if there
# is one (the abstract is then fetched and cached), or an inline `abstract`.
# Entries with neither are looked up by title; if that fails the title alone is
# used. `weight` defaults to 1.0; 0 keeps an entry on file but ignores it.
#
# Sources: the year-end lists on donskerclass.github.io (main picks 1.0,
# "see also" mentions 0.7, 2015-2017 lists 0.8 since interests have moved on),
# and papers linked from Bluesky posts (0.6).

