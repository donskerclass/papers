name: probe-arxiv
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://export.arxiv.org/api/query?search_query=cat:stat.ML&max_results=2" \
            "http://export.arxiv.org/api/query?search_query=cat:stat.ML&max_results=2" \
            "https://arxiv.org/api/query?search_query=cat:stat.ML&max_results=2" \
            "https://rss.arxiv.org/rss/stat.ML" \
            "https://oaipmh.arxiv.org/oai?verb=Identify" \
            "https://export.arxiv.org/oai2?verb=Identify" \
            "https://arxiv.org/list/stat.ML/pastweek?show=5"; do
            echo "$(curl -s -o /tmp/o -w '%{http_code} %{size_download}B %{time_total}s' -A 'paperboard/0.1 (+https://github.com/donskerclass/papers)' "$u")  $u"
            head -c 200 /tmp/o | tr '\n' ' '; echo; sleep 4
          done
