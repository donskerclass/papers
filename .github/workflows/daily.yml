name: daily

on:
  schedule:
    # arXiv announces at 20:00 US Eastern, Sunday to Thursday evenings, i.e.
    # 00:00-01:00 UTC Monday to Friday. Run a little after that. GitHub's
    # schedule is best effort, so there are backup times; the `check` job makes
    # a backup exit early once the day's listing is already live. Off-the-hour
    # minutes are dropped less. Never put [skip ci] on a commit that edits these
    # lines: the schedule failed to register until the workflow was disabled and
    # re-enabled and this file was pushed again normally. Even now, scheduled
    # runs start about 6.5 hours late, so an external cron (cron-job.org; see
    # README, "Schedule") calls workflow_dispatch with scheduled=true. These
    # crons stay as a backup that also finishes a listing arXiv's feed hadn't
    # fully filled in yet; otherwise they exit early.
    - cron: "17 2 * * 1-5"
    - cron: "37 3 * * 1-5"
    - cron: "23 6 * * 1-5"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Also send the email for this run"
        type: boolean
        default: false
      scheduled:
        description: "Behave like a scheduled run (used by the external cron): skip if today's listing is live, email only if new"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["profile/**", "src/**", "data/library/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  # For scheduled runs (native or external): is the live page already showing
  # today's complete listing? arXiv labels each listing with the UTC date of its
  # announcement. arXiv's OAI feed fills a listing in over a few hours, so a run
  # soon after the announcement often sees only part of it; the build records
  # how many papers the RSS feed lists that the harvest hadn't seen yet
  # (run.n_missing), and later runs rebuild until that reaches zero.
  check:
    runs-on: ubuntu-latest
    outputs:
      live_latest: ${{ steps.live.outputs.latest }}
      live_n_new: ${{ steps.live.outputs.n_new }}
      go: ${{ steps.live.outputs.go }}
    steps:
      - id: live
        run: |
          read -r latest n_new n_missing < <(curl -sf --retry 3 -H 'Cache-Control: no-cache' "https://donskerclass.github.io/papers/papers.json?t=$(date +%s)" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin)["run"]; print(r["latest"], r["n_new"], r.get("n_missing", 0))' || echo none 0 0)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "n_new=$n_new" >> "$GITHUB_OUTPUT"
          echo "live: listing $latest, $n_new new, $n_missing not yet in arXiv's OAI feed"
          if [ "${{ github.event_name == 'schedule' || inputs.scheduled }}" = true ] && [ "$latest" = "$(date -u +%F)" ] && [ "$n_missing" = 0 ]; then
            echo "Today's listing is already live and complete; nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
      n_new: ${{ steps.latest.outputs.n_new }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('profile/config.yaml') }}
          restore-keys: fastembed-

      - run: uv sync --frozen

      - name: Fetch, score, render
        run: uv run paperboard run
        env:
          # Optional free keys, set as repository secrets if the anonymous tiers get too slow.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}

      - name: Save newly resolved profile entries; keep the schedule alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/profile_cache.json; then
            git add data/profile_cache.json
            git commit -m "Cache newly resolved profile entries"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((45*86400)) ]; then
            # GitHub disables scheduled workflows after 60 days without activity.
            git commit --allow-empty -m "Keep the daily schedule active"
          fi
          git push || echo "push skipped"

      - name: Keep the email version for the email job
        id: latest
        run: |
          echo "latest=$(jq -r .run.latest site/papers.json)" >> "$GITHUB_OUTPUT"
          echo "n_new=$(jq -r .run.n_new site/papers.json)" >> "$GITHUB_OUTPUT"
          mkdir -p email
          mv site/email.html site/email_subject.txt email/
          cp site/index.html "email/papers-$(jq -r .run.latest site/papers.json).html"

      - uses: actions/upload-artifact@v4
        with:
          name: email
          path: email
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Emails the day's page to me after nightly runs (not after pushes that only
  # edit the profile). Needs three repository secrets; see README, "Daily email".
  # Skipped quietly if they aren't set.
  # Scheduled runs email only a listing that is newer than what was live (if
  # arXiv's feed hadn't updated yet, a later backup run picks it up), or the
  # same listing again, marked as updated, once a rerun has found more of it.
  email:
    needs: [check, build, deploy]
    if: >-
      ((github.event_name == 'schedule' || inputs.scheduled) && (needs.build.outputs.latest != needs.check.outputs.live_latest
        || fromJSON(needs.build.outputs.n_new || '0') > fromJSON(needs.check.outputs.live_n_new || '0')))
      || inputs.send_email
    runs-on: ubuntu-latest
    env:
      HAVE_SMTP: ${{ secrets.MAIL_PASSWORD != '' }}
      HAVE_RESEND: ${{ secrets.RESEND_API_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: email
          path: email

      - id: msg
        env:
          UPDATED: ${{ needs.build.outputs.latest == needs.check.outputs.live_latest && needs.build.outputs.n_new != needs.check.outputs.live_n_new }}
          WAS: ${{ needs.check.outputs.live_n_new }}
        run: |
          subject=$(cat email/email_subject.txt)
          if [ "$UPDATED" = true ]; then subject="${subject%)}; was $WAS) [updated]"; fi
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
          echo "attachment=$(ls email/papers-*.html)" >> "$GITHUB_OUTPUT"

      # Option 1: Resend (free tier), used when RESEND_API_KEY is set. Without a
      # verified domain Resend sends from onboarding@resend.dev, and only to the
      # address the Resend account was created with.
      - name: Send via Resend
        if: env.HAVE_RESEND == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SUBJECT: ${{ steps.msg.outputs.subject }}
          ATTACHMENT: ${{ steps.msg.outputs.attachment }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          att = pathlib.Path(os.environ["ATTACHMENT"])
          body = {
              "from": "Papers <onboarding@resend.dev>",
              "to": [os.environ["MAIL_TO"]],
              "subject": os.environ["SUBJECT"],
              "html": pathlib.Path("email/email.html").read_text(),
              "attachments": [{"filename": att.name, "content": base64.b64encode(att.read_bytes()).decode()}],
          }
          req = urllib.request.Request("https://api.resend.com/emails", data=json.dumps(body).encode(),
              headers={"Authorization": "Bearer " + os.environ["RESEND_API_KEY"],
                       "Content-Type": "application/json", "User-Agent": "paperboard"})
          print(urllib.request.urlopen(req).read().decode())
          PY

      # Option 2: Gmail SMTP with an app password, used when MAIL_PASSWORD is set
      # (and Resend isn't).
      - name: Send via Gmail
        if: env.HAVE_SMTP == 'true' && env.HAVE_RESEND != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Papers <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.msg.outputs.subject }}
          html_body: file://email/email.html
          attachments: ${{ steps.msg.outputs.attachment }}
